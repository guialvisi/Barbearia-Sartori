<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login do Dono | Bill Cuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #111; }
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-box {
      width: min(420px, 100%);
      background: #19191b;
      border: 1px solid #3a3a3d;
      padding: 32px 24px;
      border-radius: 2px;
      box-shadow: 8px 10px 0 rgba(0, 0, 0, 0.35);
    }
    .login-logo {
      display: block;
      width: min(260px, 78%);
      height: auto;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 18px rgba(255, 212, 0, 0.14), 0 12px 28px rgba(0, 0, 0, 0.35));
    }
    .login-box p {
      color: var(--paper-dim);
      margin-bottom: 20px;
    }
    .login-form label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--steel);
      margin-bottom: 8px;
    }
    .login-form input {
      width: 100%;
      background: #111;
      border: 1px solid #3a3a3d;
      padding: 12px 14px;
      border-radius: 2px;
      margin-bottom: 18px;
      font-size: 15px;
    }
    .login-form button {
      width: 100%;
    }
    .login-error {
      color: #ff9d7f;
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <img src="logo-billcuts.svg" alt="Bill Cuts" class="login-logo" />
      <p>Seja bem-vindo, João Victor de Oliveira Amancio (Bill). Este painel é exclusivo para a gestão da barbearia.</p>

      <form class="login-form" id="loginForm">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite a senha" required />
        <button type="submit" class="btn btn-primary">Entrar no painel</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorBox.textContent = data.error || 'Erro ao fazer login.';
          return;
        }

        window.location.href = '/admin';
      } catch {
        errorBox.textContent = 'Não foi possível entrar no painel.';
      }
    });
  </script>
</body>
</html>
